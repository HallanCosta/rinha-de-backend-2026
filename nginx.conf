# Bloco obrigatório do Nginx para configurações relacionadas a conexões.
worker_processes 1;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # O teste oficial mede a resposta, não a escrita de access logs.
    access_log off;

    # Grupo de servidores que receberá as requisições encaminhadas.
    # O Nginx usa round-robin por padrão entre estes dois destinos.
    upstream api_backend {
        # A janela curta permite que um upstream marcado durante o startup
        # volte a ser tentado assim que a API terminar de carregar o dataset.
        server api-1:9999 max_fails=1 fail_timeout=1s;
        server api-2:9999 max_fails=1 fail_timeout=1s;
        # Reutiliza conexões Nginx -> API entre requests sucessivos.
        keepalive 64;
    }

    # Servidor público do load balancer.
    server {
        # A porta interna é a mesma publicada pelo docker-compose.
        listen 9999;

        # Encaminha qualquer endpoint para uma das APIs do upstream.
        location / {
            proxy_pass http://api_backend;

            # Mantém HTTP/1.1 entre o Nginx e a API.
            proxy_http_version 1.1;

            # Preserva informações úteis da requisição original.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Permite que as conexões com upstream sejam reutilizadas.
            proxy_set_header Connection "";

            # A resposta é pequena; não precisamos de uma etapa de buffering.
            proxy_buffering off;
        }
    }
}
